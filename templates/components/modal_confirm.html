<!-- Reusable Confirmation Dialog for Destructive / Critical Actions -->
<dialog id="confirmModal" class="rounded-xl shadow-2xl p-0 border border-[#E2E8F0] backdrop:bg-slate-900/60 max-w-md w-full text-slate-900">
  <div class="bg-white rounded-xl overflow-hidden">
    
    <!-- Modal Header -->
    <div class="p-5 bg-[#F8F9FA] border-b border-[#E2E8F0] flex items-center space-x-3">
      <div id="confirmModalIcon" class="w-10 h-10 rounded-full bg-crimson-100 text-[#DC2626] flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <div>
        <h3 id="confirmModalTitle" class="text-base font-bold text-slate-900">
          Confirm Action
        </h3>
        <p class="text-xs text-slate-500">
          Federal University Dutse Security Protocol
        </p>
      </div>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <p id="confirmModalMessage" class="text-sm text-slate-700 leading-relaxed">
        Are you sure you want to proceed with this operation? This action will be logged in the Institutional Audit trail.
      </p>
    </div>

    <!-- Modal Actions with CSRF Protection -->
    <form id="confirmModalForm" method="POST" action="">
      {% csrf_token %}
      <input type="hidden" name="action_target_id" id="confirmModalTargetId" value="">
      <div class="p-4 bg-[#F8F9FA] border-t border-[#E2E8F0] flex justify-end space-x-3">
        <button type="button" onclick="closeModal('confirmModal')"
                class="px-4 py-2 text-xs font-semibold text-slate-700 hover:text-slate-900 bg-white hover:bg-slate-100 border border-slate-300 rounded-lg shadow-sm transition">
          Cancel
        </button>
        <button type="submit" id="confirmModalBtn"
                class="px-4 py-2 text-xs font-semibold text-white bg-[#DC2626] hover:bg-red-700 rounded-lg shadow transition focus:ring-2 focus:ring-red-400">
          Confirm Operation
        </button>
      </div>
    </form>

  </div>
</dialog>

<script>
  /**
   * Helper to trigger confirmation modal with dynamic parameters
   */
  function showConfirmModal(options) {
    const titleEl = document.getElementById('confirmModalTitle');
    const msgEl = document.getElementById('confirmModalMessage');
    const formEl = document.getElementById('confirmModalForm');
    const targetEl = document.getElementById('confirmModalTargetId');
    const btnEl = document.getElementById('confirmModalBtn');

    if (titleEl && options.title) titleEl.textContent = options.title;
    if (msgEl && options.message) msgEl.textContent = options.message;
    if (formEl && options.actionUrl) formEl.action = options.actionUrl;
    if (targetEl && options.targetId) targetEl.value = options.targetId;
    if (btnEl && options.buttonText) btnEl.textContent = options.buttonText;
    if (btnEl && options.buttonClass) btnEl.className = options.buttonClass;

    openModal('confirmModal');
  }
</script>
